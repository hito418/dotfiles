# Symlink mappings: target = source (relative to $DOTFILES_PATH)
# One per line. Blank lines and comments (#) are ignored.

~/.zshrc            = terminal/.zshrc
~/.gitconfig        = git/.gitconfig
~/.gitconfig.local  = git/.gitconfig.local
~/.gitattributes    = git/.gitattributes
~/.tmux.conf        = tmux/.tmux.conf
~/.vimrc            = vim/.vimrc
~/.ssh/config       = ssh/config
~/.oh-my-zsh/custom/themes   = terminal/themes
~/.oh-my-zsh/custom/plugins  = terminal/plugins
~/.claude/CLAUDE.md          = claude/CLAUDE.md
~/.claude/settings.json      = claude/settings.json
~/.claude/rules              = claude/rules
~/.claude/skills             = claude/skills
~/.claude/statusline.sh      = claude/statusline.sh
